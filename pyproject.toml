[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "redaction-lab"
version = "0.1.0"
description = "Typed contracts and synthetic fixtures for Redaction Lab"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = [
  "pypdf>=5,<7",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redaction_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

